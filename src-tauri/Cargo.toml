[package]
name = "kata"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "kata_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["unstable"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
url = "2"

# kata-patch: usa el tauri-runtime-wry vendoriado con el fix de los webview
# hijo (GtkFixed flotante dentro de un GtkOverlay) para que los bounds
# (posición/tamaño) se apliquen de verdad en Linux.
[patch.crates-io]
tauri-runtime-wry = { path = "vendor/tauri-runtime-wry-2.11.4" }
# kata-patch: wry con los fixes de GtkFixed: set_bounds reposiciona de forma
# persistente (gtk_fixed_move + size_request) y bounds() devuelve la posición
# real (evita que setSize/setPosition pisen el rect con (0,0)).
wry = { path = "vendor/wry-0.55.1" }


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
